# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

bindd = SUPER, N, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, $browser
bindd = SUPER SHIFT, B, Browser (private), exec, $browser --private
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, T, Activity, exec, $terminal -e btop
bindd = SUPER, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER, G, Signal, exec, omarchy-launch-or-focus signal "uwsm app -- signal-desktop"
bindd = SUPER, O, Obsidian, exec, omarchy-launch-or-focus obsidian "uwsm app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER, slash, Passwords, exec, uwsm app -- 1password

# If your web app url contains #, type it as ## to prevent hyperland treat it as comments
bindd = SUPER, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
bindd = SUPER SHIFT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER ALT, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu
unbind = SUPER, W
unbind = SUPER, V
unbind = SUPER, left
unbind = SUPER, right
unbind = SUPER, up
unbind = SUPER, down
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, H
unbind = SUPER, L
unbind = SUPER, TAB
unbind = SUPER, SPACE
unbind = SHIFT, F11
unbind = ALT, F11

## overwite by choma
bindd = SUPER, return, Terminal, exec, $terminal
bindd = SUPER, Q, Close active window, killactive,
bindd = SUPER, N, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, semicolon, Toggle floating, togglefloating

# Move focus with SUPER + arrow keys
bindd = SUPER, TAB, Former workspace, workspace, previous

# Cycle through applications on active workspace
# this is the solution to mimic dwm max screen mode switching windows
bindd = SUPER, K, Cycle to next window, cyclenext
bindd = SUPER, J, Cycle to prev window, cyclenext, prev
bindd = SUPER, J, Reveal active window on top, bringactivetotop
bindd = SUPER, K, Reveal active window on top, bringactivetotop
# bindd = SUPER, SPACE, layoutmsg, swapwithmaster, master
bindd = SUPER, SPACE, Swap master window, layoutmsg, swapwithmaster


bindd = SUPER, H, Expand window left, resizeactive, -100 0    # - key
bindd = SUPER, L, Shrink window left, resizeactive, 100 0     # = key

bindd = SUPER SHIFT, F11, Show key bindings, exec, omarchy-menu-keybindings
bindd = SUPER, F, Full width, fullscreen, 1
bindd = SUPER SHIFT, F, Full width, fullscreen, 0

bindd = SUPER, grave, Switch to hidden workspace, togglespecialworkspace, special:hidden1
